services:
  postgres:
    image: postgres:16-alpine
    container_name: medtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medtrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - medtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medtrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medtrack-postgres-data:
